<?xml version="1.0" encoding="UTF-8"?>
<!--
  Deliberately generic: an "@" mention glyph with an unread dot.

  This icon must NOT depict Discord's Clyde mark. Discord's brand guidelines
  forbid editing, recoloring or reconfiguring their logo, and store.kde.org's
  publishing terms make the uploader warrant no trademark infringement AND
  indemnify OpenDesktop against claims. A monochrome redraw of Clyde is still
  Clyde. An "@" is the universal symbol for a mention and belongs to nobody.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color: #232629; }
    </style>
  </defs>
  <g class="ColorScheme-Text">
    <!-- @ : inner ring and the arc that wraps it, open toward the lower right
         so the unread dot sits in the gap rather than colliding with a stroke. -->
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <circle cx="9.6" cy="9.6" r="2.6"/>
      <path d="M12.2 9.6v1.5a2.1 2.1 0 0 0 4.2 0V9.6A6.8 6.8 0 1 0 11.6 16"/>
    </g>
    <!-- Unread marker. Plasma renders this at 22px in a panel, so it has to
         read as a dot at a glance. The arc above stops short of it on purpose:
         at 22px an overlapping stroke and disc merge into one smudge. -->
    <circle cx="17.4" cy="17.4" r="3.6" fill="currentColor"/>
  </g>
</svg>
